# Optional maintainer smoke: pack scripts on Linux and macOS + pwsh (WQ-304 Phase 6).
# The Linux job runs the full behavior suite here too, blocking since 2.22.74 (WQ-446).
# On Windows the suite runs on both hosts through run_audit_tests.bat -DualShell.

name: Pack OS smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'pack/scripts/**'
      - 'pack/scripts/pwsh-wrap.sh'
      - '*.sh'
      - 'install.ps1'
      - '.github/workflows/pack-os-smoke.yml'
      # The install instructions are part of what ships. Step 67 checks their POSIX start command
      # still runs at mode 644, and that check is only reached by running the suite.
      - 'README.md'
      - 'INSTALL.md'
      - 'INSTALL.txt'
      - 'AGENTS.md'
      - 'pack/docs/START_HERE.md'
      - 'docs/PORTABLE_SETUP.md'

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pwsh (preinstalled on ubuntu-latest)
        run: pwsh --version

      - name: Check requirements JSON
        run: pwsh -NoProfile -File pack/scripts/check-requirements.ps1 -Json

      - name: OS portability probe (native Linux)
        run: pwsh -NoProfile -File pack/scripts/test-os-portability-probe.ps1 -PackRoot "$GITHUB_WORKSPACE"

      # Everything above runs the .ps1 files directly, which is what this job did for four releases
      # while triggering on changes to *.sh - so no CI step ever ran a wrapper. The first real run of
      # one found a hook that hung forever on an open stdin (2.22.63). The steps below run the
      # wrappers themselves, on the only OS where they are the documented entry point.
      #
      # This step used to begin `chmod +x ./*.sh pack/scripts/pwsh-wrap.sh`, which made it unable to
      # fail: it manufactured the execute bit before asking whether the delivery carried one, so the
      # job passed for the whole period during which every shipped .sh was committed 100644 and no
      # clone could run any of them (WQ-446). A checkout is a git clone, and git is the one channel
      # that does preserve the mode - so this is where the committed bit gets checked, by using it.
      # Informational since the git-optional decision: the execute bit is a convenience that lets a
      # reader type ./install.sh, not a requirement. It cannot be relied on in any case, because the
      # pack is delivered by download, folder copy and exFAT media as often as by clone, and none of
      # those carry a mode. The blocking guarantee is the next step - a delivery with no git and no
      # permissions must still install - so a red X here would report a cosmetic regression as a
      # broken product. Report it, do not fail on it.
      - name: Execute bit on a clone (informational - not a requirement)
        continue-on-error: true
        run: |
          set -uo pipefail
          missing=0
          for f in $(git ls-files -- '*.sh'); do
            if [ ! -x "$f" ]; then echo "not executable from this clone: $f ($(stat -c '%a' "$f"))"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "NOTE: some .sh are mode 100644 in git, so './install.sh' will not start from a clone."
            echo "      'bash install.sh' works regardless - that is the documented command."
          else
            echo "all $(git ls-files -- '*.sh' | wc -l) tracked .sh arrived executable"
          fi

      # Invoked as 'bash <file>', the documented form, because that is the only form guaranteed to
      # work on every delivery. Using './' here would have made this step depend on the mode the
      # step above just stopped requiring.
      - name: Wrappers run (bash form, the documented one)
        run: |
          set -euo pipefail
          bash Check-Requirements.sh -Json > /tmp/req.json
          python3 -c "import json,sys; d=json.load(open('/tmp/req.json')); print('packRoot', d['packRoot'])"
          if bash Bootstrap-Project.sh; then
            echo "Bootstrap-Project.sh with no arguments must exit non-zero" >&2
            exit 1
          fi

      # The other delivery shape, and the one the docs are written for: a folder copy, an unzipped
      # archive, or exFAT media, none of which carry a mode. Nothing in CI covered it, so the
      # documented first command was never the tested one. Both halves are asserted - `./install.sh`
      # must fail, because if it starts working this test is measuring nothing, and `bash install.sh`
      # must succeed, because that is what every install doc now tells a reader to run.
      - name: A mode-stripped copy installs via 'bash install.sh' (no git, no execute bit)
        env:
          HOME: /tmp/nomode-home
        run: |
          set -uo pipefail
          rm -rf /tmp/nomode /tmp/nomode-home
          mkdir -p /tmp/nomode /tmp/nomode-home
          tar -c --exclude=.git --exclude=.tmp -C "$GITHUB_WORKSPACE" . | tar -x -C /tmp/nomode
          find /tmp/nomode -type f -exec chmod 644 {} +
          cd /tmp/nomode
          test "$(find . -name '*.sh' -perm -u+x | wc -l)" = "0" || { echo "setup failed: something is still executable" >&2; exit 1; }

          set +e
          ./install.sh User >/tmp/dot.log 2>&1
          dot=$?
          set -e
          echo "./install.sh exit: $dot"
          if [ "$dot" -eq 0 ]; then
            echo "./install.sh SUCCEEDED on a mode 644 copy - this test can no longer detect the defect" >&2
            exit 1
          fi
          grep -qi 'permission denied' /tmp/dot.log || { echo "expected 'Permission denied', got:" >&2; cat /tmp/dot.log >&2; exit 1; }

          bash install.sh User
          test -d "$HOME/.cursor/AgentStarterPack"
          test -f "$HOME/.cursor/rules/agent-defaults-always.mdc"

          # The installer must hand back a runnable tree even though it was handed an unrunnable one.
          tot=$(find "$HOME/.cursor/AgentStarterPack" -name '*.sh' | wc -l)
          exe=$(find "$HOME/.cursor/AgentStarterPack" -name '*.sh' -perm -u+x | wc -l)
          echo "installed .sh executable: $exe of $tot"
          test "$tot" -gt 0
          test "$exe" = "$tot"
          test -x "$HOME/.cursor/AgentStarterPack/run_audit.sh"
          rm -rf /tmp/nomode /tmp/nomode-home

      - name: Bootstrap and refresh through the wrappers (bash)
        run: |
          set -euo pipefail
          bash Bootstrap-Project.sh /tmp/ShApp ShApp
          test -f /tmp/ShApp/AGENTS.md
          bash Refresh-AgentContext.sh /tmp/ShApp -NoClipboard
          test -f /tmp/ShApp/docs/AGENT_CONTEXT.json

      # The two the Windows suite cannot cover: install.sh writes the user profile, and run_audit.sh
      # would re-enter the behavior suite there. On a throwaway runner both are safe and are the real
      # first-run path for a Linux user. Scope is explicit - the wrapper defaults to Both, and project
      # scope would copy global rules into the checkout.
      - name: install.sh (user scope) on a throwaway profile
        run: |
          set -euo pipefail
          bash install.sh User
          test -d "$HOME/.cursor/AgentStarterPack"
          test -f "$HOME/.cursor/rules/agent-defaults-always.mdc"

      # Blocking since 2.22.74 (WQ-446). Run before run_audit so a behavior regression is not hidden
      # behind a Zone B attestation failure.
      - name: Behavior suite on Linux
        timeout-minutes: 25
        env:
          BUILD_NOPAUSE: '1'
        run: |
          set +e
          pwsh -NoProfile -File pack/scripts/verify-audit-behavior.ps1 > /tmp/behavior-linux.log 2>&1
          code=$?
          echo "suite exit: $code"
          echo '--- steps that ran ---'
          grep -cE '^[0-9]+[a-z]?\. ' /tmp/behavior-linux.log
          echo '--- summary ---'
          tail -n 3 /tmp/behavior-linux.log
          if [ "$code" -ne 0 ]; then
            echo '--- failures ---'
            grep -E '\[FAIL\]' /tmp/behavior-linux.log
          fi
          exit $code

      # Zone B CI contract: tests + git checks + publish attestation (semantic deferred to Zone A).
      - name: run_audit.sh Zone B attestation mode
        timeout-minutes: 12
        env:
          BUILD_NOPAUSE: '1'
        run: |
          set -euo pipefail
          # Behavior suite runs in-process and may touch proof-path files; attestation is checked
          # at audit init against the published commit, so restore the checkout first.
          git checkout -- .
          bash run_audit.sh

  # macOS had never been executed (WQ-436). It was treated as "Linux, near enough" on the strength of
  # both being non-Windows, which is exactly the assumption Linux itself disproved in WQ-446: that run
  # found 16 real failures against an estimate of 24 different ones. macOS differs from Linux in ways
  # this pack touches directly - a case-INSENSITIVE default filesystem (like Windows, unlike Linux),
  # BSD userland rather than GNU (stat, sed and find take different flags), and pwsh from a cask
  # rather than a distro package. Non-blocking for now because no macOS run has ever established a
  # baseline; promote to blocking once one is green, the same way Linux was.
  macos-smoke:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure pwsh
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --cask powershell || brew install powershell
          fi
          pwsh --version

      - name: Check requirements JSON
        run: pwsh -NoProfile -File pack/scripts/check-requirements.ps1 -Json

      - name: OS portability probe (native macOS)
        run: pwsh -NoProfile -File pack/scripts/test-os-portability-probe.ps1 -PackRoot "$GITHUB_WORKSPACE"

      # Informational, same reasoning as the Linux job: the bit is a convenience, not a requirement.
      - name: Execute bit on a clone (informational - not a requirement)
        continue-on-error: true
        run: |
          set -uo pipefail
          for f in $(git ls-files -- '*.sh'); do
            if [ ! -x "$f" ]; then echo "not executable from this clone: $f"; fi
          done
          echo "informational only - 'bash <file>' is the documented form and does not need the bit"

      - name: Wrappers run (bash form, the documented one)
        run: |
          set -euo pipefail
          bash Check-Requirements.sh -Json > /tmp/req.json
          python3 -c "import json; d=json.load(open('/tmp/req.json')); print('packRoot', d['packRoot'])"

      - name: A mode-stripped copy installs via 'bash install.sh'
        env:
          HOME: /tmp/nomode-home
        run: |
          set -uo pipefail
          rm -rf /tmp/nomode /tmp/nomode-home
          mkdir -p /tmp/nomode /tmp/nomode-home
          tar -c --exclude=.git --exclude=.tmp -C "$GITHUB_WORKSPACE" . | tar -x -C /tmp/nomode
          find /tmp/nomode -type f -exec chmod 644 {} +
          cd /tmp/nomode
          set +e
          ./install.sh User >/tmp/dot.log 2>&1
          dot=$?
          set -e
          test "$dot" -ne 0 || { echo "./install.sh succeeded at mode 644 - test is inert" >&2; exit 1; }
          bash install.sh User
          test -d "$HOME/.cursor/AgentStarterPack"
          tot=$(find "$HOME/.cursor/AgentStarterPack" -name '*.sh' | wc -l)
          exe=$(find "$HOME/.cursor/AgentStarterPack" -name '*.sh' -perm -u+x | wc -l)
          echo "installed .sh executable: $exe of $tot"
          test "$exe" = "$tot"
          rm -rf /tmp/nomode /tmp/nomode-home

      - name: Bootstrap and refresh through the wrappers (bash)
        run: |
          set -euo pipefail
          bash Bootstrap-Project.sh /tmp/ShApp ShApp
          test -f /tmp/ShApp/AGENTS.md
          bash Refresh-AgentContext.sh /tmp/ShApp -NoClipboard
          test -f /tmp/ShApp/docs/AGENT_CONTEXT.json

      # Report-only on the first macOS host to run it. The point of this job is to find out what
      # differs, and a red X on an unknown baseline tells us nothing we can act on yet.
      - name: Behavior suite on macOS (report-only baseline)
        timeout-minutes: 30
        env:
          BUILD_NOPAUSE: '1'
        run: |
          set +e
          pwsh -NoProfile -File pack/scripts/verify-audit-behavior.ps1 > /tmp/behavior-macos.log 2>&1
          code=$?
          echo "suite exit: $code"
          echo '--- steps that ran ---'
          grep -cE '^[0-9]+[a-z]?\. ' /tmp/behavior-macos.log
          echo '--- summary ---'
          tail -n 3 /tmp/behavior-macos.log
          echo '--- failures (the baseline this job exists to produce) ---'
          grep -E '\[FAIL\]' /tmp/behavior-macos.log
          exit 0
